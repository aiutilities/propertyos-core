name: Bug report
description: Report a reproducible defect in a supported PropertyOS release
title: "[Bug]: "
labels:
  - "type: bug"
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a PropertyOS defect.

        Do not include credentials, personal data, customer data or security-vulnerability details.

        Security vulnerabilities must be reported privately through the process in `SECURITY.md`.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: I reproduced this on a supported PropertyOS release.
          required: true
        - label: This is not a security vulnerability.
          required: true
        - label: I removed secrets and sensitive data.
          required: true

  - type: input
    id: version
    attributes:
      label: PropertyOS version
      description: Provide the release version or commit.
      placeholder: v1.0.1
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Core platform
        - Property and tenancy
        - Rent, invoice or receipt
        - Maintenance, facility or asset
        - Procurement
        - Inventory
        - Plugin platform
        - Theme platform
        - AI platform
        - Frontend
        - Deployment or infrastructure
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Defect description
      description: Explain what went wrong.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable reproduction.
      placeholder: |
        1. Configure...
        2. Run...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include deployment method, operating system, database and runtime versions.
      placeholder: |
        Deployment:
        Operating system:
        Database:
        Node.js:
        Browser:
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs and evidence
      description: Include sanitized logs, screenshots or other evidence.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
