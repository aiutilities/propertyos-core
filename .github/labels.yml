# PropertyOS GitHub label catalogue
#
# This file is the repository source of truth for issue and pull-request labels.
# Applying these labels to GitHub is a separate controlled repository action.

- name: "type: bug"
  color: "d73a4a"
  description: "A reproducible defect in supported PropertyOS behaviour"

- name: "type: enhancement"
  color: "a2eeef"
  description: "A proposed future capability or improvement"

- name: "type: documentation"
  color: "0075ca"
  description: "Documentation correction, clarification or improvement"

- name: "type: question"
  color: "d876e3"
  description: "Usage, architecture or contributor question"

- name: "type: maintenance"
  color: "cfd3d7"
  description: "Repository, dependency or operational maintenance"

- name: "type: governance"
  color: "5319e7"
  description: "Governance, policy or project-authority work"

- name: "type: security"
  color: "b60205"
  description: "Public security-hardening work without private vulnerability details"

- name: "type: test"
  color: "1d76db"
  description: "Testing, verification or quality assurance"

- name: "type: release"
  color: "0052cc"
  description: "Release preparation, certification or publication"

- name: "status: needs triage"
  color: "ededed"
  description: "Awaiting initial maintainer review"

- name: "status: needs information"
  color: "fbca04"
  description: "Additional evidence or clarification is required"

- name: "status: accepted"
  color: "0e8a16"
  description: "Accepted for governed execution"

- name: "status: blocked"
  color: "b60205"
  description: "Blocked by a dependency, decision or operational condition"

- name: "status: in progress"
  color: "1d76db"
  description: "Authorized work is actively in progress"

- name: "status: review required"
  color: "5319e7"
  description: "Awaiting technical, governance or security review"

- name: "status: duplicate"
  color: "cfd3d7"
  description: "Duplicates an existing issue or pull request"

- name: "status: declined"
  color: "ffffff"
  description: "Reviewed and not accepted"

- name: "status: completed"
  color: "0e8a16"
  description: "Work is complete and validated"

- name: "priority: critical"
  color: "b60205"
  description: "Immediate attention required"

- name: "priority: high"
  color: "d93f0b"
  description: "High-priority work"

- name: "priority: medium"
  color: "fbca04"
  description: "Normal planned priority"

- name: "priority: low"
  color: "0e8a16"
  description: "Low-priority or opportunistic work"

- name: "scope: core"
  color: "0052cc"
