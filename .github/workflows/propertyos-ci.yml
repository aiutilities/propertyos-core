name: PropertyOS CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: propertyos-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: propertyos
          POSTGRES_USER: propertyos
          POSTGRES_PASSWORD: propertyos
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U propertyos -d propertyos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5433
      POSTGRES_DB: propertyos
      POSTGRES_USER: propertyos
      POSTGRES_PASSWORD: propertyos
      AUTH_SECRET: propertyos-ci-secret-must-be-at-least-32-characters
      CORS_ORIGIN: http://localhost:3002
      RATE_LIMIT_TTL_MS: 60000
      RATE_LIMIT_MAX: 100
      STORAGE_LOCAL_ROOT: ./uploads
      SCHEDULER_POLL_INTERVAL_MS: 30000
      SCHEDULER_BATCH_SIZE: 20
      SCHEDULER_STALE_AFTER_MS: 300000
      SCHEDULER_RETRY_BASE_DELAY_MS: 30000
      SCHEDULER_MAX_RETRY_DELAY_MS: 300000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify authorization assurance
        run: npm run knowledge:authorization:check

      - name: Run database migrations
        run: npm run migrate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run integration tests
        run: npm test -- --runInBand

      - name: Verify production entrypoints
        run: |
          test -f dist/main.js
          test -f dist/scheduler-worker.js
          test -f dist/database/runner/migration-runner.js

      - name: Upload backend test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            backend/coverage
            backend/test-results
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

  containers:
    name: Container validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - backend
      - frontend

    defaults:
      run:
        working-directory: backend

    env:
      AUTH_SECRET: propertyos-ci-secret-must-be-at-least-32-characters

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build API, scheduler and migration images
        run: docker compose build api scheduler migrate

      - name: Verify API image entrypoint
        run: |
          docker run --rm \
            --entrypoint sh \
            backend-api:latest \
            -c 'test -f dist/main.js'

      - name: Verify scheduler image entrypoint
        run: |
          docker run --rm \
            --entrypoint sh \
            backend-scheduler:latest \
            -c 'test -f dist/scheduler-worker.js'

      - name: Verify migration image entrypoint
        run: |
          docker run --rm \
            --entrypoint sh \
            backend-migrate:latest \
            -c 'test -f dist/database/runner/migration-runner.js'
