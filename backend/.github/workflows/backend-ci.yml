name: Backend CI

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-test-docker:
    name: Build, Test, Audit, and Docker
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: propertyos
          POSTGRES_USER: propertyos
          POSTGRES_PASSWORD: propertyos
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U propertyos -d propertyos"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5433
      POSTGRES_DB: propertyos
      POSTGRES_USER: propertyos
      POSTGRES_PASSWORD: propertyos
      AUTH_SECRET: propertyos-ci-test-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run migrate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run integration tests
        run: npm run test:integration

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Docker image
        run: docker build -t propertyos-backend-ci .
