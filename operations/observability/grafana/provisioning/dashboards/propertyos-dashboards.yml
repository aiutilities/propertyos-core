    orgId: 1
    folder: PropertyOS
    folderUid: propertyos
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards/propertyos
      foldersFromFilesStructure: false
