groups:
  - name: propertyos.idempotency.recording
    interval: 30s
    rules:
      - record: propertyos:idempotency_requests:rate5m
        expr: sum by (operation) (rate(propertyos_idempotency_requests_total[5m]))

      - record: propertyos:idempotency_replays:rate5m
        expr: sum by (operation) (rate(propertyos_idempotency_replays_total[5m]))

      - record: propertyos:idempotency_conflicts:rate5m
        expr: sum by (operation, conflictCode) (rate(propertyos_idempotency_conflicts_total[5m]))

      - record: propertyos:idempotency_failures:rate5m
        expr: sum by (operation) (rate(propertyos_idempotency_failures_total[5m]))

      - record: propertyos:idempotency_failure_ratio:rate5m
        expr: sum by (operation) (rate(propertyos_idempotency_failures_total[5m])) / clamp_min(sum by (operation) (rate(propertyos_idempotency_requests_total[5m])), 0.001)

      - record: propertyos:idempotency_conflict_ratio:rate5m
        expr: sum by (operation) (rate(propertyos_idempotency_conflicts_total[5m])) / clamp_min(sum by (operation) (rate(propertyos_idempotency_requests_total[5m])), 0.001)

      - record: propertyos:idempotency_duration_ms:avg5m
        expr: sum by (operation) (rate(propertyos_idempotency_duration_ms_sum[5m])) / clamp_min(sum by (operation) (rate(propertyos_idempotency_duration_ms_count[5m])), 0.001)

